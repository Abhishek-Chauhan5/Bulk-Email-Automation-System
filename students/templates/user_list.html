<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>User Data</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        padding: 50px 20px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background-color: #ffffff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
        text-align: center;
        color: #333333;
        margin-bottom: 30px;
        font-size: 30px;
    }

    .actions {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        padding: 12px 20px;
        text-decoration: none;
        color: #ffffff;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        background-color: #667eea;
        color: #ffffff;
        padding: 15px;
        text-align: left;
        font-size: 15px;
    }

    td {
        padding: 14px 15px;
        border-bottom: 1px solid #dddddd;
        color: #444444;
    }

    tbody tr:hover {
        background-color: #f5f7ff;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .no-user {
        text-align: center;
        color: #888888;
        padding: 25px;
        font-style: italic;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 10px;
        }

        .container {
            padding: 20px;
        }

        .actions {
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            text-align: center;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>👥 User Data</h1>

    <div class="actions">
        <a class="btn" href="{% url 'upload_excel' %}">
            📂 Upload Excel
        </a>

        <a class="btn" href="{% url 'download_excel' %}">
            📥 Download Excel
        </a>
    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.age }}</td>
                    <td>{{ student.email }}</td>
                </tr>

                {% empty %}

                <tr>
                    <td class="no-user" colspan="4">
                        No user found.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>
```

</body>
</html>
