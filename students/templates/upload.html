```
<title>Upload Excel</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 450px;
        max-width: 90%;
        background: #ffffff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        text-align: center;
    }

    h1 {
        color: #333333;
        margin-bottom: 25px;
        font-size: 28px;
    }

    .message {
        background-color: #e8f5e9;
        color: #2e7d32;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 6px;
        font-size: 14px;
    }

    .file-input {
        width: 100%;
        padding: 12px;
        border: 2px dashed #667eea;
        border-radius: 8px;
        background-color: #f8f9ff;
        cursor: pointer;
        margin-bottom: 20px;
    }

    .file-input:hover {
        background-color: #eef0ff;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .view-users {
        display: inline-block;
        margin-top: 25px;
        text-decoration: none;
        color: #667eea;
        font-weight: bold;
        transition: 0.3s;
    }

    .view-users:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    @media (max-width: 500px) {
        .container {
            padding: 25px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>📂 Upload Excel File</h1>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <input 
            class="file-input"
            type="file" 
            name="excel_file" 
            accept=".xlsx" 
            required
        >

        <button type="submit">
            Upload Excel
        </button>

    </form>

    <a class="view-users" href="{% url 'user_list' %}">
        View All Users →
    </a>

</div>
```

</body>
</html>
